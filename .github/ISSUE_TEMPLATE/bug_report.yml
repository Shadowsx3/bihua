name: Bug report
description: Something is broken or behaves differently from the documentation.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please do not attach a full backup or personal study data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bihua version
      placeholder: "1.0.1 (versionCode 3)"
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [System, Light, Dark, Not applicable]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal notes, character history, and backup contents first.
