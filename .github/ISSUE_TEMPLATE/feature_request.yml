name: Feature request
description: Suggest a focused improvement to Bihua.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Bihua is deliberately small. Explain the learner problem before the UI.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is hard, slow, unclear, or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed approach
      description: A sketch is enough. Mention alternatives if you have them.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Study flow / FSRS
        - Writing / stroke feedback
        - Pronunciation
        - Dictionary / content
        - Word or paper practice
        - Accessibility
        - Data / backup / sync
        - Local assistant
        - Packaging / release
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
