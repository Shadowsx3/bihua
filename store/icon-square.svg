<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Bihua ink-leaf app icon">
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#254b36"/>
      <stop offset="0.45" stop-color="#14281c"/>
      <stop offset="1" stop-color="#09110c"/>
    </radialGradient>
    <linearGradient id="ink" x1="220" y1="760" x2="820" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0d995"/>
      <stop offset="0.5" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#f4c96a"/>
    </linearGradient>
    <linearGradient id="vein" x1="280" y1="740" x2="780" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d9870"/>
      <stop offset="1" stop-color="#9be8bd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd3a1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7fd3a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#09110c"/><rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="810" cy="190" r="390" fill="url(#glow)"/>
  <circle cx="190" cy="860" r="300" fill="#7fd3a1" opacity="0.06"/>

  <g transform="rotate(-18 512 512)">
  <!-- one sweep, tapered like a brush leaving the page -->
  <g filter="url(#soft)">
    <path d="M188 735 C286 804 428 814 568 758 C684 712 776 624 838 506 C850 482 856 458 856 438 C804 486 742 520 670 548 C542 598 402 636 292 676 C244 694 208 714 188 735 Z" fill="url(#ink)"/>
    <path d="M242 748 C354 792 500 780 626 714" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- leaf vein / stem -->
  <path d="M300 716 C416 706 548 662 664 592 C716 560 760 518 796 472" fill="none" stroke="url(#vein)" stroke-width="17" stroke-linecap="round"/>
  <path d="M506 674 C500 636 504 596 520 558" fill="none" stroke="url(#vein)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M624 606 C636 572 654 542 680 516" fill="none" stroke="url(#vein)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

  <!-- ink dot -->
  <circle cx="272" cy="350" r="30" fill="#f3c85a"/>
  <circle cx="262" cy="338" r="9" fill="#fff8e4" opacity="0.7"/>
  </g>
</svg>
