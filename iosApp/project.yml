name: Bihua
options:
  bundleIdPrefix: com.bassmd
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Bihua:
    build:
      targets:
        Bihua: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BihuaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Bihua:
    type: application
    platform: iOS
    sources:
      - path: Bihua
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bassmd.bihua
        PRODUCT_NAME: Bihua
        INFOPLIST_FILE: Bihua/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/$(CONFIGURATION:lower)Framework
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/bin/iosArm64/$(CONFIGURATION:lower)Framework
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - BihuaKit
        # Static framework, nothing to embed. Simulator builds turn signing
        # off on the command line; device builds use automatic signing.
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    preBuildScripts:
      - name: Build BihuaKit
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          case "$SDK_NAME" in
            iphoneos*)
              if [ "$CONFIGURATION" = "Release" ]; then
                TASK=":composeApp:linkReleaseFrameworkIosArm64"
              else
                TASK=":composeApp:linkDebugFrameworkIosArm64"
              fi
              ;;
            *)
              if [ "$CONFIGURATION" = "Release" ]; then
                TASK=":composeApp:linkReleaseFrameworkIosSimulatorArm64"
              else
                TASK=":composeApp:linkDebugFrameworkIosSimulatorArm64"
              fi
              ;;
          esac
          ./gradlew "$TASK" --console=plain

  BihuaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BihuaUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bassmd.bihua.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bihua
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Bihua
